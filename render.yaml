services:
  - type: web
    name: ats-resume-analyzer
    runtime: python

    buildCommand: "./build.sh"

    startCommand: "gunicorn ats_analyzer.wsgi:application"

    plan: free

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: PYTHON_VERSION
        value: "3.10.11"

      - key: DATABASE_URL
        fromDatabase:
          name: ats-resume-db
          property: connectionString

databases:
  - name: ats-resume-db
    plan: free